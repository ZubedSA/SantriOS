# Cloudflare Pages / Workers Configuration for SantriOS Web
name = "santrios-web"
pages_build_output_dir = ".open-next/assets"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Public / default environment variables for Cloudflare Edge
[vars]
NEXT_PUBLIC_APP_URL = "https://santrios.id"
NODE_ENV = "production"

# Note: Secret variables (DATABASE_URL, DIRECT_URL, AUTH_SECRET)
# should be added securely in Cloudflare Dashboard -> Pages -> Settings -> Environment Variables.

# Optional: Cloudflare Hyperdrive configuration for PostgreSQL acceleration
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "your-hyperdrive-id"
